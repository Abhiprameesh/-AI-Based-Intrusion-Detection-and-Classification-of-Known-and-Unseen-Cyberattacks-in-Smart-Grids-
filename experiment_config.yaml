environment:
  device: cpu
  python_version: 3.12.10
hyperparameters:
  autoencoder:
    batch_size: 128
    epochs: 25
    latent_dim: 16
    threshold_percentile: 95.0
  random_forest:
    class_weight: balanced_subsample
    max_depth: 20
    n_estimators: 100
  xgboost:
    eval_metric: logloss
    learning_rate: 0.1
    max_depth: 6
    n_estimators: 150
project:
  primary_dataset: data4cyber_dataset
  random_seed: 42
  secondary_dataset: PMU_Data_with_Anomalies_and_Events
  title: Robust AI-Based Intrusion Detection and Classification of Known and Unseen
    Cyberattacks in Smart Grids
selected_models:
  binary_detection: XGBoost
  multiclass_classification: Random_Forest
  temporal_waveform_model: CNN_LSTM
  unseen_attack_detection: Deep_Autoencoder
